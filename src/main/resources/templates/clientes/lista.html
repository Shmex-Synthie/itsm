<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes - SimpliTicket</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>
<main class="page-content">
<div th:replace="~{fragments/nav :: mensagens}"></div>
<h1>Clientes</h1>
<p class="page-action"><a class="button" th:href="@{/app/clientes/novo}">Novo cliente</a></p>
<table border="1" cellpadding="6">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.id}"></td>
            <td th:text="${cliente.nome}"></td>
            <td th:text="${cliente.email}"></td>
            <td th:text="${cliente.telefone}"></td>
            <td><a class="table-action" th:href="@{/app/clientes/{id}(id=${cliente.id})}">Detalhes</a> | <a th:href="@{/app/clientes/{id}/editar(id=${cliente.id})}">Editar</a> | <a th:href="@{/app/chamados(clienteId=${cliente.id})}">Chamados</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="5">Nenhum cliente cadastrado.</td>
        </tr>
    </tbody>
</table>
</main>
</body>
</html>
