<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulário de categoria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: menu}"></div>
<main class="page-content">
<div th:replace="~{fragments/nav :: mensagens}"></div>
<h1 th:text="${titulo}">Categoria</h1>
<form method="post" th:action="@{${acao}}" th:object="${form}">
<p>
    <label>Nome: <input type="text" th:field="*{nome}" maxlength="100" required></label> 
    <small th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
</p>
<p>
    <label>Descrição: <textarea th:field="*{descricao}" maxlength="250" required></textarea></label> 
    <small th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></small>
</p>
<button type="submit">Salvar</button> 
<a class="button button-secondary" th:href="@{/app/categorias}">Cancelar</a>
</form>
</main>
</body>
</html>
